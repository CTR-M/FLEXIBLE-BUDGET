<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>변동예산 대시보드 (보안)</title>
<style>
:root{color-scheme:light}
body{margin:0;font-family:"Noto Sans KR","맑은 고딕",Arial,sans-serif;background:#1F4E78;color:#222;
display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:#fff;border-radius:14px;padding:34px 30px;width:340px;box-shadow:0 10px 40px rgba(0,0,0,.3);text-align:center}
.box h1{font-size:18px;margin:0 0 4px;color:#1F4E78}
.box p{font-size:12px;color:#6b7280;margin:0 0 20px}
.box input[type=password],.box input[type=text]#pw{width:100%;padding:11px 12px;border:1px solid #cfd6df;border-radius:8px;font-size:15px;box-sizing:border-box}
.showpw{display:flex;align-items:center;gap:6px;font-size:12px;color:#6b7280;margin-top:8px;cursor:pointer;user-select:none}
.showpw input{width:auto;margin:0;cursor:pointer}
.box button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:8px;background:#1F4E78;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.box button:hover{background:#16385a}
.err{color:#c0392b;font-size:12px;min-height:16px;margin-top:10px}
.lock{font-size:30px;margin-bottom:8px}
</style></head>
<body>
<div class="box">
  <div class="lock">🔒</div>
  <h1>전사 변동예산 대시보드</h1>
  <p>열람 비밀번호를 입력하세요</p>
  <input id="pw" type="password" placeholder="비밀번호" autofocus onkeydown="if(event.key==='Enter')go()">
  <label class="showpw"><input type="checkbox" id="showpw"> 비밀번호 표시</label>
  <button onclick="go()">열기</button>
  <div class="err" id="err"></div>
</div>
<script>
document.getElementById('showpw').addEventListener('change',function(){
  document.getElementById('pw').type=this.checked?'text':'password';
  document.getElementById('pw').focus();
});
